[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atomos"
version = "0.1.0"
description = "Atomos - Python AI Agent Harness powered by Cordis micro-kernel patterns"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Atomos Contributors" }
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
atomos = "atomos.cli.main:app"
atimos = "atomos.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
